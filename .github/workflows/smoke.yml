name: Live smoke

# Nightly: call the live API and check that its SDK contract still matches the
# vendored tests/contract/sdk-v1.json.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip && pip install -e .
      - name: Releases and data namespaces against v2.plasticdb.org
        run: python -m scripts.live_smoke
      - name: Live SDK contract matches the vendored copy
        run: python -m scripts.refresh_contract --check
